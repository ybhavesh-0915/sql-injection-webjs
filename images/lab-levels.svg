<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" rx="14" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Three Levels of the Lab — Same Query, Three Handling Styles</text>
  <text x="480" y="66" text-anchor="middle" font-size="13.5" fill="#64748b">Payload used everywhere: ' OR '1'='1' --</text>

  <!-- Level 1 -->
  <g>
    <rect x="50" y="96" width="860" height="118" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.3"/>
    <text x="76" y="126" font-size="15" font-weight="700" fill="#991b1b">Level 1 · Vulnerable — concatenated</text>
    <rect x="76" y="140" width="330" height="34" rx="7" fill="#ffffff" stroke="#fca5a5"/>
    <text x="241" y="162" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#0f172a">"…" + username + "…"</text>
    <line x1="406" y1="157" x2="464" y2="157" stroke="#dc2626" stroke-width="2" marker-end="url(#b)"/>
    <rect x="470" y="140" width="300" height="34" rx="7" fill="#ffffff" stroke="#fca5a5"/>
    <text x="620" y="162" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#991b1b">all 3 users returned</text>
    <text x="76" y="200" font-size="12.5" fill="#b45309">input changes the query → authentication can be bypassed</text>
  </g>

  <!-- Level 2 -->
  <g>
    <rect x="50" y="246" width="860" height="118" rx="12" fill="#fefce8" stroke="#fde047" stroke-width="1.3"/>
    <text x="76" y="276" font-size="15" font-weight="700" fill="#854d0e">Level 2 · Filtered — blacklist</text>
    <rect x="76" y="290" width="330" height="34" rx="7" fill="#ffffff" stroke="#fde047"/>
    <text x="241" y="312" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#0f172a">reject ' " ; -- /* */</text>
    <line x1="406" y1="307" x2="464" y2="307" stroke="#ca8a04" stroke-width="2" marker-end="url(#b)"/>
    <rect x="470" y="290" width="300" height="34" rx="7" fill="#ffffff" stroke="#fde047"/>
    <text x="620" y="312" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#854d0e">payload blocked — query never runs</text>
    <text x="76" y="350" font-size="12.5" fill="#854d0e">naive defence — the filter also rejects legitimate inputs like O'Brien</text>
  </g>

  <!-- Level 3 -->
  <g>
    <rect x="50" y="396" width="860" height="118" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.3"/>
    <text x="76" y="426" font-size="15" font-weight="700" fill="#15803d">Level 3 · Parameterized — bound value</text>
    <rect x="76" y="440" width="330" height="34" rx="7" fill="#ffffff" stroke="#86efac"/>
    <text x="241" y="462" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#0f172a">WHERE username = ?  +  bind value</text>
    <line x1="406" y1="457" x2="464" y2="457" stroke="#16a34a" stroke-width="2" marker-end="url(#b)"/>
    <rect x="470" y="440" width="300" height="34" rx="7" fill="#ffffff" stroke="#86efac"/>
    <text x="620" y="462" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#15803d">treated as data — no match</text>
    <text x="76" y="500" font-size="12.5" fill="#15803d">correct fix — query structure can never be changed by input</text>
  </g>

  <text x="480" y="544" text-anchor="middle" font-size="11" fill="#94a3b8">cyber-lab · SQL Injection</text>
</svg>
