<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="520" rx="14" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Why Prepared Statements Stop SQL Injection</text>

  <!-- ===== vulnerable lane ===== -->
  <rect x="40" y="70" width="880" height="150" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="64" y="100" font-size="15" font-weight="700" fill="#b91c1c">Vulnerable — query built by string concatenation</text>

  <rect x="70" y="116" width="340" height="42" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="240" y="142" text-anchor="middle" font-family="Consolas, monospace" font-size="13.5" fill="#0f172a">SELECT … WHERE username = ?  +  value</text>

  <rect x="470" y="116" width="240" height="42" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="590" y="142" text-anchor="middle" font-family="Consolas, monospace" font-size="13.5" fill="#991b1b">merged before parsing</text>

  <rect x="745" y="116" width="145" height="42" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="817" y="142" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">query rewritten</text>

  <line x1="410" y1="137" x2="468" y2="137" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
  <line x1="710" y1="137" x2="743" y2="137" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
  <text x="240" y="185" text-anchor="middle" font-size="12.5" fill="#b45309">value can change the query's structure → becomes code</text>

  <!-- ===== safe lane ===== -->
  <rect x="40" y="250" width="880" height="170" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.3"/>
  <text x="64" y="280" font-size="15" font-weight="700" fill="#15803d">Parameterized — prepared statement with placeholder</text>

  <rect x="70" y="300" width="250" height="48" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="195" y="322" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#0f172a">SELECT * FROM users</text>
  <text x="195" y="340" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#0f172a">WHERE username = ?</text>

  <rect x="480" y="300" width="230" height="48" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="595" y="322" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#0f172a">username</text>
  <text x="595" y="340" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#64748b">'' OR '1'='1' --</text>

  <rect x="745" y="292" width="145" height="64" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="817" y="318" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">value parsed</text>
  <text x="817" y="336" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">only as DATA</text>

  <line x1="320" y1="324" x2="478" y2="324" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#a)"/>
  <line x1="710" y1="324" x2="743" y2="324" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <text x="365" y="307" font-size="12.5" fill="#15803d">skeleton and value travel separately</text>
  <text x="817" y="386" text-anchor="middle" font-size="12.5" font-weight="600" fill="#15803d">inert payload ☑</text>
  <text x="480" y="470" text-anchor="middle" font-size="12.5" fill="#475569">The same payload that rewrites Level 1 is merely a string that matches no username at Level 3.</text>

  <text x="480" y="502" text-anchor="middle" font-size="11" fill="#94a3b8">cyber-lab · SQL Injection</text>
</svg>
