<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" rx="14" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">How SQL Injection Turns Data into Code</text>

  <!-- Flow boxes -->
  <g>
    <rect x="40" y="80" width="200" height="86" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="140" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">User Input</text>
    <text x="140" y="134" text-anchor="middle" font-size="12" fill="#64748b">trusted as plain data</text>
    <text x="140" y="152" text-anchor="middle" font-size="11" fill="#94a3b8">' OR '1'='1' --</text>
  </g>

  <g>
    <rect x="300" y="80" width="200" height="86" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="400" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">String Concatenation</text>
    <text x="400" y="134" text-anchor="middle" font-size="12" fill="#64748b">query = SQL + input</text>
    <text x="400" y="152" text-anchor="middle" font-size="11" fill="#94a3b8">no code/data separation</text>
  </g>

  <g>
    <rect x="560" y="80" width="200" height="86" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="660" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">SQL Engine</text>
    <text x="660" y="134" text-anchor="middle" font-size="12" fill="#991b1b">parses the NEW logic</text>
    <text x="660" y="152" text-anchor="middle" font-size="11" fill="#b91c1c">attacker's predicate runs</text>
  </g>

  <g>
    <rect x="790" y="80" width="150" height="86" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="865" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">Auth Bypass</text>
    <text x="865" y="134" text-anchor="middle" font-size="12" fill="#991b1b">all users returned</text>
    <text x="865" y="152" text-anchor="middle" font-size="12" fill="#b91c1c">unintended</text>
  </g>

  <line x1="240" y1="123" x2="298" y2="123" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="500" y1="123" x2="558" y2="123" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="760" y1="123" x2="788" y2="123" stroke="#dc2626" stroke-width="2" marker-end="url(#arrR)"/>

  <!-- code strip -->
  <text x="480" y="228" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">What the server ultimately receives</text>
  <rect x="60" y="244" width="840" height="54" rx="8" fill="#0f172a"/>
  <text x="84" y="277" font-family="Consolas, monospace" font-size="16" fill="#e2e8f0">SELECT * FROM users WHERE username = '</text>
  <text x="470" y="277" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#f87171">'' OR '1'='1' --</text>
  <text x="640" y="277" font-family="Consolas, monospace" font-size="16" fill="#e2e8f0">'</text>
  <text x="655" y="277" font-family="Consolas, monospace" font-size="13" fill="#64748b">← appended user input</text>

  <!-- takeaway strip -->
  <rect x="60" y="330" width="840" height="66" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="480" y="356" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d4ed8">Root cause: untrusted input is glued into the SQL string, so it is parsed as CODE, not DATA.</text>
  <text x="480" y="378" text-anchor="middle" font-size="13" fill="#1e40af">The attacker never touched a line of source code — only the input value.</text>

  <text x="480" y="436" text-anchor="middle" font-size="11" fill="#94a3b8">cyber-lab · SQL Injection</text>
</svg>
